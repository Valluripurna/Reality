name: Build Android APK (RealityChain CI/CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    name: Build Standalone Installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Native Android Code
        run: npx expo prebuild --platform android --clean

      - name: Build Standalone Android APK Binary File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Installable APK Artifact (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: realitychain-app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
