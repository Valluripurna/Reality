name: Build Mobile Apps (.APK, .AAB, iOS) - RealityChain CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android-apk:
    name: Build Standalone Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Native Standalone APK Binary
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Installable Android APK Binary (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: realitychain-installable-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-android-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm ci

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build Play Store App Bundle Binary (.aab)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload Play Store Android AAB Binary (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: realitychain-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
